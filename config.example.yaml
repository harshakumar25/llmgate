# LLMGate configuration. Copy to config.yaml and edit.
# Run with: LLMGATE_CONFIG=config.yaml go run ./cmd/llmgate

addr: ":8080"

# Providers are tried in order. The router fails over to the next one on error.
providers:
  - name: openai
    base_url: https://api.openai.com
    api_key: ${OPENAI_API_KEY}   # expanded from the environment
    model: gpt-4o-mini
  - name: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-haiku-5-5
  - name: ollama
    base_url: http://localhost:11434
    model: llama3.2

# Per upstream call. Raise it for slow local models (e.g. reasoning models on CPU).
upstream_timeout_s: 60

# Failover / retry. Retryable errors (timeouts, 429, 5xx) back off
# exponentially with jitter; other 4xx fail over to the next provider at once.
max_attempts: 2
backoff_ms: 200
max_backoff_ms: 2000

# Circuit breaker: after N retryable failures in a row a provider is skipped
# for the cooldown, then gets one trial call. 0 disables it.
breaker_failures: 5
breaker_cooldown_s: 30

# Completion cache (LRU). Identical in-flight requests are coalesced into one
# upstream call whenever caching is on. cache_ttl_s: 0 turns both off.
cache_max_entries: 10000
cache_ttl_s: 300

# Security guardrails (LLMGate's differentiator).
block_prompt_injection: true
redact_pii: true
redact_output: false   # also scrub PII from replies (not from live stream fragments)

# Per-key rate limit (API key, or client IP when api_keys is empty). 0 = off.
rate_limit_rpm: 0
rate_limit_burst: 0    # 0 = same as rate_limit_rpm

# Comma-separated API keys. Leave empty to run open (local dev only).
api_keys: ""

# Share the completion cache across replicas (built-in client, fails open).
# redis: localhost:6379

# Persistent metering (driver is TODO; in-memory until then).
# database: postgres://llmgate:llmgate@localhost:5432/llmgate?sslmode=disable
